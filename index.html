<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      const storedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (storedTheme ? storedTheme === 'dark' : prefersDark) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <button
      class="theme-toggle"
      type="button"
      aria-label="切换深色模式"
      title="切换深色模式"
    >
      <svg
        class="icon-sun"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </svg>
      <svg
        class="icon-moon"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>
    <main>
      <section class="profile">
        <h1>Welcome to My Profile</h1>
        <p>Hello everyone</p>
      </section>

      <section>
        <h2>Web Development</h2>

        <div class="skills-section">
          <h3>Skills</h3>
          <div class="skills-grid">
            <div class="skill-tag">HTML/CSS</div>
            <div class="skill-tag">JavaScript</div>
            <div class="skill-tag">React</div>
          </div>
        </div>

        <div class="projects-section">
          <h3>Projects</h3>
          <div class="projects-grid">
            <div class="project-card">
              <h4>Todo List</h4>
              <p>A todo list web app built with React</p>
              <div class="tech-tags">
                <span>React</span>
                <span>CSS</span>
              </div>
              <a href="https://sweet-cendol-82c915.netlify.app/" target="_blank"
                >View Project →</a
              >
            </div>

            <div class="project-card">
              <h4>Nasa App</h4>
              <p>A Nasa App built with React and Nasa API</p>
              <div class="tech-tags">
                <span>React</span>
                <span>CSS</span>
                <span>Nasa API</span>
              </div>
              <a
                href="https://wondrous-belekoy-fd52fe.netlify.app/"
                target="_blank"
                >View Project →</a
              >
            </div>
          </div>
        </div>
      </section>

      </main>
    <script src="script.js"></script>
  </body>
</html>
